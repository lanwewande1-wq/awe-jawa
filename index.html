<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basa Jawa Translator V3</title>
<style>
:root{color-scheme:dark;--bg:#10131b;--panel:#1b2230;--accent:#8b7cff;--text:#f3f4f8;--muted:#aeb6c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif;padding:18px}main{max-width:760px;margin:auto}h1{margin:.2em 0;color:#c6bcff}p{color:var(--muted)}.panel{background:var(--panel);padding:16px;border-radius:16px;margin:14px 0}button,select{background:#342f55;color:white;border:0;border-radius:10px;padding:12px;font-size:1rem}button{cursor:pointer;margin:4px}input{max-width:100%}img{max-width:100%;border-radius:10px;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}.result{white-space:pre-wrap;overflow-wrap:anywhere}.label{color:#c6bcff;font-weight:700}.hidden{display:none}textarea{width:100%;min-height:80px;background:#10131b;color:white;border:1px solid #424b60;border-radius:10px;padding:10px}small{color:var(--muted)}
</style></head><body><main><h1>Basa Jawa Translator</h1><p>V3 · Baca aksara Jawa dari gambar, transliterasi Latin, dan terjemahan Indonesia.</p>
<section class="panel"><label for="mode">Mode pembacaan</label><br><select id="mode"><option value="normal">Mode Biasa (1 pembacaan)</option><option value="prediction">Mode Prediksi (3 pembacaan + penggabungan)</option></select><p><input type="file" id="file" accept="image/*"></p><img id="preview" class="hidden" alt="Pratinjau gambar"><div class="row"><button id="go">Baca gambar</button><button id="clear">Reset</button></div><p id="status"></p></section>
<section id="output" class="panel hidden"><h2>Hasil</h2><div class="label">Aksara Jawa</div><textarea id="jawa" readonly></textarea><button data-copy="jawa">Salin</button><div class="label">Latin</div><textarea id="latin" readonly></textarea><button data-copy="latin">Salin</button><div class="label">Terjemahan Indonesia</div><textarea id="indo" readonly></textarea><button data-copy="indo">Salin</button><div id="notes"></div><div id="scans"></div></section>
<p><small>Hasil AI dapat keliru, terutama pada tulisan tangan, gambar buram, pasangan, atau sandhangan. Periksa kembali bagian yang diberi catatan.</small></p></main>
<script>
const file=document.getElementById('file'), preview=document.getElementById('preview'), status=document.getElementById('status');let selected=null;
file.onchange=()=>{selected=file.files[0];if(selected){preview.src=URL.createObjectURL(selected);preview.classList.remove('hidden')}};
async function compress(f){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?resolve(b):reject(Error('Gagal memproses gambar')),'image/jpeg',.82)};img.onerror=reject;img.src=URL.createObjectURL(f)})}
function b64(blob){return new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.onerror=j;fr.readAsDataURL(blob)})}
document.getElementById('go').onclick=async()=>{if(!selected){status.textContent='Pilih gambar aksara Jawa terlebih dahulu.';return}status.textContent='Sedang membaca gambar…';document.getElementById('output').classList.add('hidden');try{const blob=await compress(selected),data=await b64(blob);const mode=document.getElementById('mode').value==='prediction'?'prediction':'normal';const r=await fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode,image:data,mimeType:'image/jpeg'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Permintaan gagal');const x=d.result||{};document.getElementById('jawa').value=x.jawa||'';document.getElementById('latin').value=x.latin||'';document.getElementById('indo').value=x.indonesia||'';document.getElementById('notes').innerHTML='<div class="label">Catatan ketidakpastian</div><p>'+((x.catatan||[]).map(n=>String(n)).join(' • ')||'Tidak ada catatan.')+'</p>';document.getElementById('scans').innerHTML=mode==='prediction'?'<h3>3 hasil pembacaan</h3>'+d.scans.map((s,i)=>`<div class="panel"><b>Scan ${i+1}</b><p>${(s.latin||s.jawa||'').replace(/</g,'&lt;')}</p></div>`).join(''):'';document.getElementById('output').classList.remove('hidden');status.textContent='Selesai.'}catch(e){status.textContent='Error: '+e.message}};
document.querySelectorAll('[data-copy]').forEach(btn=>btn.onclick=async()=>{await navigator.clipboard.writeText(document.getElementById(btn.dataset.copy).value);status.textContent='Teks disalin.'});document.getElementById('clear').onclick=()=>{selected=null;file.value='';preview.classList.add('hidden');document.getElementById('output').classList.add('hidden');status.textContent='Direset.'};
</script></body></html>
